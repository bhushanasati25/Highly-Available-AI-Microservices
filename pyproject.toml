[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hams"
version = "1.0.0"
description = "Highly Available AI Microservices Platform"
authors = [{ name = "DeepMind Agentic Engineering" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.25.0",
    "structlog>=23.2.0",
    "prometheus-client>=0.19.0",
    "redis>=5.0.0",
    "apscheduler>=3.10.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
    "scheduler/tests",
    "services/api-gateway/tests",
    "services/training-orchestrator/tests",
    "services/model-manager/tests",
    "services/monitoring/tests",
]
python_files = "test_*.py"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
