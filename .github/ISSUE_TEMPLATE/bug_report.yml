name: 🐛 Bug Report
description: Create a bug report to help improve HAMS microservices
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for submitting a bug report! Please provide as much detail as possible.
  - type: input
    id: component
    attributes:
      label: Affected Component / Service
      description: Which microservice or component is affected?
      placeholder: "e.g., Data Ingestion (C++), 50-Node Rescheduler, API Gateway"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the issue and unexpected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can maintainers reproduce the issue?
      value: |
        1. Run command '...'
        2. Inspect output
        3. See error
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / Error Traces
      description: Paste any relevant terminal logs, panic stacktraces, or pytest failure outputs.
      render: shell
  - type: input
    id: environment
    attributes:
      label: Environment Info
      description: OS version, compiler version, Docker version.
      placeholder: "macOS 14.5 / Ubuntu 22.04, Python 3.11, Clang 15"
