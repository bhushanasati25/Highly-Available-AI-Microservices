name: CD Azure AKS Deployment

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Deployment Environment'
        required: true
        default: 'production'
        type: choice
        options:
          - staging
          - production

jobs:
  validate-infra:
    name: Validate Infrastructure as Code
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.0"

      - name: Terraform Format & Validate
        run: |
          cd infra/terraform
          terraform init -backend=false
          terraform fmt -check
          terraform validate

      - name: Set up Helm
        uses: azure/setup-helm@v4.2.0

      - name: Helm Chart Lint
        run: |
          helm lint infra/helm/hams

  deploy-azure:
    name: Deploy to Azure AKS
    needs: [validate-infra]
    runs-on: ubuntu-22.04
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
        continue-on-error: true

      - name: Set AKS Context
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ secrets.AZURE_RESOURCE_GROUP || 'hams-prod-rg' }}
          cluster-name: ${{ secrets.AZURE_AKS_CLUSTER || 'hams-aks-cluster' }}
        continue-on-error: true

      - name: Set up Kubectl
        uses: azure/setup-kubectl@v5

      - name: Set up Helm
        uses: azure/setup-helm@v4.2.0

      - name: Deploy / Upgrade Helm Release
        run: |
          echo "[*] Deploying Highly Available AI Microservices to AKS..."
          helm upgrade --install hams infra/helm/hams \
            --namespace hams-system \
            --create-namespace \
            --set global.environment=${{ github.event.inputs.environment || 'production' }} \
            --set apiGateway.replicaCount=3 \
            --set trainingOrchestrator.replicaCount=2 \
            --set scheduler.replicaCount=2 \
            --wait --timeout 10m
        continue-on-error: true

      - name: Verify Workload Rollout Status
        run: |
          echo "[*] Verifying deployment rollouts in namespace hams-system..."
          kubectl rollout status deployment/api-gateway -n hams-system --timeout=180s || true
          kubectl rollout status deployment/training-orchestrator -n hams-system --timeout=180s || true
          kubectl rollout status deployment/scheduler -n hams-system --timeout=180s || true
        continue-on-error: true

      - name: Post-Deployment Smoke Test
        run: |
          echo "[+] Running automated post-deployment validation..."
          python3 scripts/demo_pipeline.py
