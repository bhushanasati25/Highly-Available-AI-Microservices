apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api-gateway
  labels:
    app: api-gateway
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: {{ .Values.apiGateway.port }}
      protocol: TCP
      name: http
  selector:
    app: api-gateway
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-scheduler
  labels:
    app: scheduler
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.scheduler.port }}
      targetPort: {{ .Values.scheduler.port }}
      protocol: TCP
      name: http
  selector:
    app: scheduler
