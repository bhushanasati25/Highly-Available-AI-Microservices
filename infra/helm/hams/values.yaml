global:
  environment: prod
  registry: "hamsacr.azurecr.io"
  tag: "latest"
  imagePullPolicy: IfNotPresent

apiGateway:
  replicaCount: 3
  image: "hams/api-gateway"
  port: 8080
  resources:
    limits:
      cpu: "2000m"
      memory: "2048Mi"
    requests:
      cpu: "500m"
      memory: "512Mi"
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 15
    targetCPUUtilizationPercentage: 70

scheduler:
  replicaCount: 2
  image: "hams/scheduler"
  port: 8087
  resources:
    limits:
      cpu: "4000m"
      memory: "4096Mi"
    requests:
      cpu: "1000m"
      memory: "1024Mi"

dataIngestion:
  replicaCount: 2
  image: "hams/data-ingestion"
  grpcPort: 50051
  healthPort: 8081

preprocessing:
  replicaCount: 2
  image: "hams/preprocessing"
  grpcPort: 50052
  healthPort: 8082

storageManager:
  replicaCount: 2
  image: "hams/storage-manager"
  port: 8083

trainingOrchestrator:
  replicaCount: 2
  image: "hams/training-orchestrator"
  port: 8084

modelManager:
  replicaCount: 2
  image: "hams/model-manager"
  port: 8085

monitoring:
  replicaCount: 2
  image: "hams/monitoring"
  port: 8086
