apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: hams-prod
  labels:
    app: api-gateway
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: api-gateway
---
apiVersion: v1
kind: Service
metadata:
  name: data-ingestion
  namespace: hams-prod
  labels:
    app: data-ingestion
spec:
  type: ClusterIP
  ports:
    - port: 50051
      targetPort: 50051
      protocol: TCP
      name: grpc
    - port: 8081
      targetPort: 8081
      protocol: TCP
      name: health
  selector:
    app: data-ingestion
---
