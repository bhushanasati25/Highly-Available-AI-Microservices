apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-external-ingress
  namespace: hams-prod
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    # Allow inter-service pod communication within the namespace
    - from:
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-external-to-api-gateway
  namespace: hams-prod
spec:
  podSelector:
    matchLabels:
      app: api-gateway
  policyTypes:
    - Ingress
  ingress:
    - from: [] # external internet / ingress controller
      ports:
        - protocol: TCP
          port: 8080
